# ==========================================
# إعدادات التحليل (08-tree-shaking.md)
# ==========================================
#
# هذا الملف يطبق:
# - معيار 8: Tree Shaking
# - قواعد الكود النظيف
# - تحسينات الأداء

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  errors:
    # أخطاء حرجة
    missing_required_param: error
    missing_return: error
    dead_code: warning
    unused_element: warning
    unused_field: warning
    unused_import: warning
    unused_local_variable: warning

  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "build/**"
    - "lib/generated/**"

linter:
  rules:
    # ===== قواعد الأداء =====
    # استخدام const حيثما أمكن
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables

    # تجنب إعادة البناء غير الضرورية
    - avoid_unnecessary_containers
    - sized_box_for_whitespace

    # تجنب dynamic
    - avoid_dynamic_calls
    - avoid_returning_null_for_void

    # ===== قواعد Tree Shaking =====
    # تجنب الاستيرادات غير المستخدمة
    - directives_ordering
    - unnecessary_import

    # تجنب الكود الميت
    - unreachable_from_main

    # ===== قواعد الوضوح =====
    - always_declare_return_types
    - always_put_required_named_parameters_first
    - annotate_overrides
    - avoid_init_to_null
    - avoid_redundant_argument_values
    - prefer_final_fields
    - prefer_final_locals

    # ===== قواعد التوثيق =====
    - public_member_api_docs: false  # تعطيل لتقليل الحجم

    # ===== قواعد الأسلوب =====
    - prefer_single_quotes
    - sort_constructors_first
    - sort_unnamed_constructors_first
    - use_super_parameters

    # ===== قواعد الأمان =====
    - avoid_print: false  # تفعيل في الإنتاج
    - avoid_web_libraries_in_flutter: false  # نحتاجها للويب
