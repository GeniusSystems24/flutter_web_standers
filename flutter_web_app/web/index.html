<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SEO و PWA -->
  <meta name="description" content="تطبيق Flutter Web محسن">
  <meta name="theme-color" content="#2196F3">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <title>Flutter Web Optimized</title>

  <style>
    :root {
      --primary-color: #2196F3;
      --background-color: #FAFAFA;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--background-color);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .splash-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: var(--background-color);
      transition: opacity 0.3s ease-out;
    }

    .splash-screen.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .splash-logo {
      width: 120px;
      height: 120px;
      margin-bottom: 24px;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.8; }
    }

    .splash-loader {
      width: 200px;
      height: 4px;
      background: #E0E0E0;
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .splash-loader-bar {
      height: 100%;
      width: 0%;
      background: var(--primary-color);
      border-radius: 2px;
      transition: width 0.3s ease;
    }

    .splash-status {
      font-size: 14px;
      color: #757575;
      text-align: center;
    }
  </style>
</head>

<body>
  <div id="splash" class="splash-screen">
    <svg class="splash-logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#2196F3"/>
          <stop offset="100%" style="stop-color:#1976D2"/>
        </linearGradient>
      </defs>
      <circle cx="50" cy="50" r="45" fill="url(#logoGradient)"/>
      <path d="M30 50 L50 70 L70 30" stroke="white" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>

    <div class="splash-loader">
      <div id="loader-bar" class="splash-loader-bar"></div>
    </div>

    <p id="splash-status" class="splash-status">جاري تحميل التطبيق...</p>
  </div>

  <script src="flutter.js" defer></script>

  <script>
    // Splash Manager
    const SplashManager = {
      loaderBar: document.getElementById('loader-bar'),
      statusText: document.getElementById('splash-status'),
      splash: document.getElementById('splash'),

      updateProgress: function(percent, message) {
        if (this.loaderBar) {
          this.loaderBar.style.width = percent + '%';
        }
        if (this.statusText && message) {
          this.statusText.textContent = message;
        }
      },

      hide: function() {
        if (this.splash) {
          this.splash.classList.add('fade-out');
          setTimeout(function() {
            var s = document.getElementById('splash');
            if (s) s.remove();
          }, 300);
        }
      }
    };

    // اختيار المحرك الأمثل
    function selectOptimalRenderer() {
      var isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
      var hasWeakCPU = navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 2;
      var isSlowConnection = navigator.connection &&
                             (navigator.connection.effectiveType === '2g' ||
                              navigator.connection.effectiveType === 'slow-2g' ||
                              navigator.connection.effectiveType === '3g');

      if (isMobile || hasWeakCPU || isSlowConnection) {
        console.log('[Renderer] Using HTML renderer');
        return 'html';
      }

      console.log('[Renderer] Using CanvasKit');
      return 'canvaskit';
    }

    // استقبال إشارة الجاهزية من Flutter
    window.flutterReady = function() {
      SplashManager.updateProgress(100, 'جاهز!');
      setTimeout(function() { SplashManager.hide(); }, 200);
    };

    // تهيئة Flutter باستخدام API الجديد
    window.addEventListener('load', function() {
      SplashManager.updateProgress(10, 'جاري تهيئة Flutter...');

      _flutter.loader.load({
        onEntrypointLoaded: async function(engineInitializer) {
          SplashManager.updateProgress(40, 'جاري تحميل المحرك...');

          var renderer = selectOptimalRenderer();

          try {
            var appRunner = await engineInitializer.initializeEngine({
              renderer: renderer,
            });

            SplashManager.updateProgress(70, 'جاري بدء التطبيق...');
            await appRunner.runApp();
            SplashManager.updateProgress(90, 'جاري التحضير النهائي...');
          } catch (e) {
            console.warn('[Renderer] Falling back to HTML:', e);
            var appRunner = await engineInitializer.initializeEngine({
              renderer: 'html',
            });
            await appRunner.runApp();
          }
        }
      });
    });
  </script>
</body>
</html>
